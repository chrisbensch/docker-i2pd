---
services:
  i2pd:
    container_name: i2pd
    image: docker-i2pd:router-local
    build:
      context: .
      target: router
    network_mode: host
    volumes:
      - ./appdata/var/lib/i2pd/:/var/lib/i2pd/
      - ./appdata/reseed:/reseed:ro
      - type: bind
        source: ./config/i2pd.conf
        target: /var/lib/i2pd/i2pd.conf
        read_only: true
        bind:
          create_host_path: false
    restart: always
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:7070/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
  reseed:
    profiles: [bootstrap]
    image: docker-i2pd:reseed-local
    build:
      context: .
      target: reseed
    init: true
    volumes:
      - ./appdata/reseed:/reseed
